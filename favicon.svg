<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
  </defs>
  <!-- Shield Background -->
  <path d="M 50,4 C 74,4 90,14 90,36 C 90,68 50,96 50,96 C 50,96 10,68 10,36 C 10,14 26,4 50,4 Z" 
        fill="url(#shieldGrad)" stroke="#d4af37" stroke-width="3" />
  <!-- Inner Shield Border -->
  <path d="M 50,9 C 71,9 85,18 85,38 C 85,64 50,89 50,89 C 50,89 15,64 15,38 C 15,18 29,9 50,9 Z" 
        fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.6"/>
  <!-- Cross in Gold -->
  <path d="M 50,16 L 50,46 M 40,24 L 60,24" stroke="#d4af37" stroke-width="3.5" stroke-linecap="round" />
  <!-- Open Book Symbol -->
  <path d="M 28,52 C 38,48 48,51 50,56 C 52,51 62,48 72,52 L 72,70 C 62,66 52,69 50,74 C 48,69 38,66 28,70 Z" 
        fill="#ffffff" stroke="#d4af37" stroke-width="1.8" />
  <line x1="50" y1="56" x2="50" y2="74" stroke="#0f2b48" stroke-width="2" />
  <!-- Star / Light Accent -->
  <circle cx="50" cy="24" r="2.5" fill="#ffffff" />
  <!-- Small Star at bottom -->
  <polygon points="50,78 52,82 56,82 53,84 54,88 50,85 46,88 47,84 44,82 48,82" fill="#d4af37" />
</svg>
